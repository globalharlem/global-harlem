<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Global Harlem — Email Signature · Baron Carr</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Cormorant+Garamond:ital@1&family=Barlow:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #ffffff;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 32px;
  }

  /* ── SIGNATURE ── */
  table.sig { border-collapse: collapse; }

  .sig-left {
    padding: 0 28px 0 0;
    vertical-align: middle;
  }

  .sig-wordmark-global {
    font-family: 'Barlow', Arial Black, Arial, sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #2D6A4F;
    text-transform: uppercase;
    line-height: 1;
    letter-spacing: -0.01em;
    display: block;
  }

  .sig-wordmark-harlem {
    font-family: 'Barlow', Arial Black, Arial, sans-serif;
    font-weight: 800;
    font-size: 30px;
    color: #0D1B2A;
    text-transform: uppercase;
    line-height: 1;
    letter-spacing: -0.01em;
    display: block;
  }

  .sig-rule {
    display: block;
    width: 28px;
    height: 1px;
    background: #2D6A4F;
    margin: 8px 0;
  }

  .sig-tagline {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-style: italic;
    font-size: 10px;
    letter-spacing: 0.1em;
    color: rgba(13,27,42,0.45);
    display: block;
  }

  .sig-divider {
    width: 1px;
    background: rgba(45,106,79,0.25);
    padding: 0;
  }

  .sig-right {
    padding: 0 0 0 24px;
    vertical-align: middle;
  }

  .sig-name {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 15px;
    color: #0D1B2A;
    letter-spacing: 0.02em;
    display: block;
    margin-bottom: 2px;
  }

  .sig-title {
    font-family: 'Barlow', Arial, sans-serif;
    font-weight: 600;
    font-size: 8px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: #2D6A4F;
    display: block;
    margin-bottom: 10px;
  }

  .sig-contact-row {
    display: block;
    margin-bottom: 3px;
  }

  .sig-contact-row a {
    font-family: 'Barlow', Arial, sans-serif;
    font-size: 11px;
    color: rgba(13,27,42,0.6);
    text-decoration: none;
    letter-spacing: 0.03em;
  }

  .sig-dot {
    display: inline-block;
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: #2D6A4F;
    margin-right: 6px;
    vertical-align: middle;
    position: relative;
    top: -1px;
  }

  .sig-footer-left {
    font-family: 'Barlow', Arial, sans-serif;
    font-size: 7px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: rgba(13,27,42,0.25);
    padding-top: 10px;
  }

  .sig-footer-badge {
    font-family: 'Barlow', Arial, sans-serif;
    font-size: 7px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #2D6A4F;
    border: 1px solid rgba(45,106,79,0.4);
    padding: 2px 7px;
  }
</style>
</head>
<body>

<!-- ═══ COPY FROM HERE ═══ -->
<table class="sig" cellpadding="0" cellspacing="0" border="0">
  <tr>
    <!-- LEFT: wordmark -->
    <td class="sig-left">
      <span class="sig-wordmark-global">GLOBAL</span>
      <span class="sig-wordmark-harlem">HARLEM</span>
      <span class="sig-rule"></span>
      <span class="sig-tagline">Local Roots. Global Impact.</span>
    </td>

    <!-- DIVIDER -->
    <td class="sig-divider" width="1">&nbsp;</td>

    <!-- RIGHT: contact -->
    <td class="sig-right">
      <span class="sig-name">Baron Carr</span>
      <span class="sig-title">Founder</span>
      <span class="sig-contact-row">
        <span class="sig-dot"></span>
        <a href="mailto:baron@globalharlem.com">baron@globalharlem.com</a>
      </span>
      <span class="sig-contact-row">
        <span class="sig-dot"></span>
        <a href="tel:+17632187171">763-218-7171</a>
      </span>
      <span class="sig-contact-row">
        <span class="sig-dot"></span>
        <a href="https://baroncarr.com">baroncarr.com</a>
      </span>
    </td>
  </tr>

  <!-- FOOTER ROW -->
  <tr>
    <td class="sig-footer-left" colspan="1">Global Harlem</td>
    <td></td>
    <td style="padding-top:10px; padding-left:24px;">
      <span class="sig-footer-badge">Est. 2026</span>
    </td>
  </tr>
</table>
<!-- ═══ COPY TO HERE ═══ -->

</body>
</html>

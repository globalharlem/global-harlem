<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mindset Disrupt — Podcast Cover</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #111;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .cover {
      width: 3000px;
      height: 3000px;
      overflow: hidden;
      background-color: #1A3D2B;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Diagonal texture overlay */
    .cover::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(
        -55deg,
        transparent,
        transparent 120px,
        rgba(45, 106, 79, 0.04) 120px,
        rgba(45, 106, 79, 0.04) 121px
      );
      pointer-events: none;
    }

    .cover-inner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    .cover-title-mindset {
      font-family: 'DM Serif Display', serif;
      font-size: 280px;
      font-weight: 400;
      color: #FAF7F0;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .cover-title-disrupt {
      font-family: 'DM Serif Display', serif;
      font-size: 280px;
      font-weight: 400;
      color: #FAF7F0;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .cover-rule {
      width: 120px;
      height: 1px;
      background-color: #2D6A4F;
      opacity: 0.6;
      margin: 80px auto;
    }

    .cover-byline {
      font-family: 'Space Mono', monospace;
      font-size: 52px;
      font-weight: 400;
      color: #3D8A68;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin-bottom: 32px;
    }

    .cover-brand {
      font-family: 'Space Mono', monospace;
      font-size: 36px;
      font-weight: 400;
      color: #3D8A68;
      letter-spacing: 0.3em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="cover">
    <div class="cover-inner">
      <div class="cover-title-mindset">MINDSET</div>
      <div class="cover-title-disrupt">DISRUPT</div>
      <div class="cover-rule"></div>
      <div class="cover-byline">Baron Carr</div>
      <div class="cover-brand">Global Harlem</div>
    </div>
  </div>
</body>
</html>
